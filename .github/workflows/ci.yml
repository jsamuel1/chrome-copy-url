name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate extension
        run: node scripts/validate.mjs
      - name: Build package
        id: build
        run: |
          echo "zip=$(scripts/build.sh)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./manifest.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-zip-${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.zip }}
          if-no-files-found: error

      # Rolling pre-release so testers always have a one-click download of main.
      - name: Publish rolling "latest" pre-release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "${{ steps.build.outputs.zip }}" --prerelease \
            --target "$GITHUB_SHA" --title "Latest build (${{ steps.build.outputs.version }})" \
            --notes "Built from ${GITHUB_SHA}. Unzip, then chrome://extensions → Developer mode → Load unpacked."
