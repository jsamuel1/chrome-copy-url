name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Validate extension
        run: node scripts/validate.mjs
      - name: Build package
        id: build
        run: |
          echo "zip=$(scripts/build.sh)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./manifest.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-zip-${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.zip }}
          if-no-files-found: error

      # Rolling pre-release so testers always have a one-click download of main.
      - name: Publish rolling "latest" pre-release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "${{ steps.build.outputs.zip }}" --prerelease \
            --target "$GITHUB_SHA" --title "Latest build (${{ steps.build.outputs.version }})" \
            --notes "Built from ${GITHUB_SHA}. Unzip, then chrome://extensions → Developer mode → Load unpacked."
