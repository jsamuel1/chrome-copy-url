name: Release

# Bump "version" in manifest.json, commit, then push a matching tag:
#   git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Validate extension (tag must match manifest version)
        run: node scripts/validate.mjs "${GITHUB_REF_NAME}"
      - name: Build package
        id: build
        run: echo "zip=$(scripts/build.sh)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "${{ steps.build.outputs.zip }}" --title "${GITHUB_REF_NAME}" --generate-notes

      - name: Upload and publish to Chrome Web Store
        env:
          EXTENSION_ID: ${{ vars.EXTENSION_ID }}
          PUBLISHER_ID: ${{ vars.PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          if [ -z "$EXTENSION_ID" ] || [ -z "$PUBLISHER_ID" ] || [ -z "$REFRESH_TOKEN" ]; then
            echo "::warning::Chrome Web Store credentials not configured; skipped store upload. See PUBLISHING.md."
            exit 0
          fi
          npx --yes chrome-webstore-upload-cli@4.0.2 --source "${{ steps.build.outputs.zip }}"
